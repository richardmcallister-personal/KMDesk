name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Bump CACHE in public/service-worker.js before each deploy, or phones
      # keep serving the shell they already have.
      - name: Fail if the service worker cache was not bumped
        run: |
          V=$(grep -o 'km-desk-v[0-9]*' public/service-worker.js | head -1)
          echo "service worker cache: $V"
          git fetch --depth=2 origin ${{ github.ref_name }} || true
          if git show HEAD~1:public/service-worker.js 2>/dev/null | grep -q "$V"; then
            if ! git diff --quiet HEAD~1 HEAD -- public/; then
              echo "::error::public/ changed but $V was not bumped in service-worker.js"
              exit 1
            fi
          fi

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
