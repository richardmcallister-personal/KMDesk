<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Commitments, marketplace numbers, projects and decisions for the Global Deputy CEO.">
<meta name="theme-color" content="#FDF6F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1215" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Desk">
<style>
  /* Same reset the preview page ran under, so the two look identical. */
  :root {
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { margin: 0; padding: 0; }
  img { max-width: 100%; }
  [hidden]:not([hidden="until-found"]) { display: none !important; }
</style>
<title>Deputy CEO Desk</title>
<style>
/* Layout: fixed-height app shell — scrolling list pane under a bottom tab bar,
   with a full-screen dark detail sheet that slides over it. */
@font-face { font-family: "Murphy Sans"; src: url("./fonts/murphy-sans-300.ttf") format("truetype"); font-weight: 300; font-style: normal; font-display: swap; }
@font-face { font-family: "Murphy Sans"; src: url("./fonts/murphy-sans-500.ttf") format("truetype"); font-weight: 500; font-style: normal; font-display: swap; }

:root {
  --shell: #F4EFEF;
  --bg: #FDF6F6;
  --panel: #FFFFFF;
  --fg: #0F1215;
  --fg-soft: #55585c;
  --fg-faint: #6E7175;
  --rule: #dfd8d8;
  --rule-soft: #efe9e9;
  --coral: #F2816E;
  --accent: #B4493A;
  --accent-tint: #FDEDE9;
  --accent-edge: #F0C8C0;
  --blue: #2C5A73;
  --blue-tint: #EAF3F9;
  --lilac: #5B4580;
  --lilac-tint: #F1ECF8;
  --gold: #6B5A14;
  --gold-tint: #F8F1D2;
  --sheet-bg: #0F1215;
  --sheet-fg: #FDF6F6;
  --sheet-soft: #a8a5a3;
  --sheet-rule: #262a2e;
  --sheet-raise: #141a1f;
  --sheet-accent: #F2816E;
  --logo: url("./img/wordmark-ink.png");
  --display: "Murphy Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --shell: #0F1215;
    --bg: #0F1215;
    --panel: #161a1e;
    --fg: #FDF6F6;
    --fg-soft: #a8a5a3;
    --fg-faint: #8f8c8a;
    --rule: #262a2e;
    --rule-soft: #1e2226;
    --accent: #F2816E;
    --accent-tint: #2B1D1A;
    --accent-edge: #3a2520;
    --blue: #A9CFE5;
    --blue-tint: #16242C;
    --lilac: #AE93D9;
    --lilac-tint: #221D2C;
    --gold: #D9B948;
    --gold-tint: #272213;
    --sheet-bg: #161a1e;
    --sheet-rule: #2c3135;
    --sheet-raise: #1b2126;
    --logo: url("./img/wordmark-light.png");
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --shell: #0F1215;
  --bg: #0F1215;
  --panel: #161a1e;
  --fg: #FDF6F6;
  --fg-soft: #a8a5a3;
  --fg-faint: #8f8c8a;
  --rule: #262a2e;
  --rule-soft: #1e2226;
  --accent: #F2816E;
  --accent-tint: #2B1D1A;
  --accent-edge: #3a2520;
  --blue: #A9CFE5;
  --blue-tint: #16242C;
  --lilac: #AE93D9;
  --lilac-tint: #221D2C;
  --gold: #D9B948;
  --gold-tint: #272213;
  --sheet-bg: #161a1e;
  --sheet-rule: #2c3135;
  --sheet-raise: #1b2126;
  --logo: url("./img/wordmark-light.png");
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--shell);
  color: var(--fg);
  font-family: var(--display);
  font-weight: 300;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }

#app { height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; position: relative; background: var(--shell); }

/* ---- app header: the wordmark stays put over every tab and over the sheet ---- */
#apphead {
  flex: 0 0 auto; z-index: 40;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  height: 52px; padding: 0 16px;
  background: var(--bg); border-bottom: 1px solid var(--rule);
}
#apphead .brand { margin-top: 0; }
#recheck.spin svg { animation: km-spin 0.8s linear infinite; }
@keyframes km-spin { to { transform: rotate(360deg); } }
#apphead .stamp { margin-top: 0; font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; }

/* ---- pane ---- */
#pane { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 22px 16px 26px; }
#pane::-webkit-scrollbar { width: 0; }

h1.view { margin: 0; font-size: 27px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.1; text-wrap: balance; }
.sub-line { margin: 7px 0 0; font-size: 12.5px; color: var(--fg-soft); }
h2.sec { margin: 26px 0 10px; font-size: 12px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-soft); }

/* ---- cards ---- */
.card { background: var(--panel); border: 1px solid var(--rule); border-radius: 16px; overflow: hidden; }
.card + .card { margin-top: 14px; }

.row { display: flex; align-items: stretch; border-top: 1px solid var(--rule-soft); }
.row:first-child { border-top: 0; }
.tickbtn { flex: 0 0 auto; width: 48px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; cursor: pointer; padding: 0; }
.tickbtn span { width: 21px; height: 21px; border: 1.5px solid var(--fg-faint); border-radius: 11px; display: block; }
.tickbtn:hover span { border-color: var(--accent); background: var(--accent-tint); }
.rowmain { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 14px 14px 14px 0; background: transparent; border: 0; cursor: pointer; text-align: left; }
.rowmain:hover { background: var(--rule-soft); }
.rowtext { flex: 1 1 auto; min-width: 0; }
.rowwho { font-size: 15px; font-weight: 500; line-height: 1.3; }
.needlist { max-height: 62vh; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.needlist .rowsub { -webkit-line-clamp: 5; }
.scrollhint { margin-top: 8px; }
.rowsub { margin-top: 2px; font-size: 12.5px; line-height: 1.4; color: var(--fg-soft); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.age { flex: 0 0 auto; font-size: 12.5px; font-weight: 500; color: var(--fg-soft); }
.age.hot { color: var(--accent); }
.chev { flex: 0 0 auto; color: var(--fg-faint); display: flex; }

.pill { display: inline-block; font-size: 11px; font-weight: 500; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 10px; }
.pill.new { color: var(--blue); background: var(--blue-tint); }
.pill.warn { color: var(--accent); background: var(--accent-tint); }

/* ---- chips ---- */
.chips { display: flex; gap: 7px; margin-top: 16px; flex-wrap: wrap; }
.chip { min-height: 36px; padding: 0 14px; font-size: 12px; letter-spacing: 0.03em; border-radius: 18px; background: var(--panel); border: 1px solid var(--rule); color: var(--fg-soft); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg); }

/* ---- today ---- */
.hello { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.eyebrow { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-soft); }
.iconbtn { flex: 0 0 auto; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: var(--panel); border: 1px solid var(--rule); border-radius: 22px; cursor: pointer; }
.focuscard { margin-top: 18px; background: var(--panel); border: 1px solid var(--rule); border-radius: 16px; padding: 16px; }
.focushead { display: flex; align-items: center; gap: 8px; }
.dot { width: 8px; height: 8px; border-radius: 4px; background: var(--coral); }
#focus { width: 100%; margin-top: 10px; background: transparent; border: 0; resize: none; font-size: 15px; line-height: 1.45; padding: 0; }
#focus::placeholder { color: var(--fg-faint); }

.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
.tile { background: var(--panel); border: 1px solid var(--rule); border-radius: 16px; padding: 15px; min-width: 0; }
.tile.hot { background: var(--accent-tint); border-color: var(--accent-edge); }
.tileval { font-size: 22px; font-weight: 500; letter-spacing: -0.02em; }
.tile.hot .tileval { color: var(--accent); }
.tilelbl { margin-top: 5px; font-size: 11.5px; line-height: 1.35; color: var(--fg-soft); }
.tilescope { display: block; font-size: 10px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg); margin-bottom: 2px; }
.tile.hot .tilescope { color: var(--accent); }
.tile.hot .tilelbl { color: var(--accent); }

/* ---- numbers ---- */
.bigcard { background: var(--panel); border: 1px solid var(--rule); border-radius: 16px; padding: 18px; margin-top: 16px; }
.bigval { margin-top: 8px; font-size: 34px; font-weight: 500; letter-spacing: -0.03em; line-height: 1; }
.bars { margin-top: 16px; display: flex; flex-direction: column; gap: 11px; }
.barrow { font-size: 12.5px; }
.barhead { display: flex; justify-content: space-between; gap: 10px; }
.bartrack { margin-top: 5px; height: 6px; border-radius: 3px; background: var(--rule-soft); overflow: hidden; }
.barfill { display: block; height: 6px; border-radius: 3px; }
.hotcard { background: var(--accent-tint); border: 1px solid var(--accent-edge); border-radius: 16px; padding: 18px; margin-top: 14px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 10px; }
.kpi { font-size: 20px; font-weight: 500; }
.kpil { font-size: 11.5px; color: var(--fg-soft); }
.note { margin: 12px 0 0; font-size: 11.5px; line-height: 1.5; color: var(--fg-soft); }

/* ---- work ---- */
.wrow { padding: 16px; border-top: 1px solid var(--rule-soft); background: transparent; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; text-align: left; cursor: pointer; display: block; }
.wrow:first-child { border-top: 0; }
.wrow:hover { background: var(--rule-soft); }
.whead { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.wname { font-size: 15.5px; font-weight: 500; }
.wmeta { flex: 0 0 auto; font-size: 11.5px; color: var(--fg-soft); }
.wnext { margin: 7px 0 0; font-size: 12.5px; line-height: 1.45; color: var(--fg-soft); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* ---- more ---- */
.linkrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 56px; padding: 0 16px; border-top: 1px solid var(--rule-soft); text-decoration: none; color: var(--fg); font-size: 15px; }
.linkrow:first-child { border-top: 0; }
.linkrow:hover { background: var(--rule-soft); }
.linkrow .r { font-size: 12.5px; color: var(--fg-soft); }

/* ---- tab bar ---- */
#tabs { flex: 0 0 auto; display: flex; background: var(--panel); border-top: 1px solid var(--rule); padding: 6px 2px calc(8px + env(safe-area-inset-bottom, 0px)); }
.tab { flex: 1 1 0; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: transparent; border: 0; cursor: pointer; color: var(--fg-soft); padding: 0; }
.tab[aria-current="true"] { color: var(--accent); }
.tablbl { font-size: 10.5px; letter-spacing: 0.01em; }
.tabcount { font-variant-numeric: tabular-nums; }

/* ---- detail sheet ---- */
#sheet {
  position: absolute; top: 52px; right: 0; bottom: 0; left: 0; z-index: 30;
  background: var(--sheet-bg); color: var(--sheet-fg);
  display: flex; flex-direction: column;
  transform: translateX(0);
  transition: transform .26s cubic-bezier(.22,.7,.3,1);
}
#sheet[hidden] { display: none !important; }
#sheet.enter { transform: translateX(14px); opacity: .6; }
@media (prefers-reduced-motion: reduce) { #sheet { transition: none; } #sheet.enter { transform: none; opacity: 1; } }
.sheettop { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 14px 0; }
.backbtn { min-height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 12px 0 8px; border-radius: 22px; background: transparent; border: 0; color: var(--sheet-soft); cursor: pointer; font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; }
.sheetpos { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--sheet-soft); padding-right: 6px; }
.sheetbody { flex: 1 1 auto; min-height: 0; -webkit-overflow-scrolling: touch; overflow-y: auto; padding: 14px 20px 18px; }
.sheetbody::-webkit-scrollbar { width: 0; }
.tagrow { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.tag { font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; padding: 4px 10px; border-radius: 10px; }
.tag.age { background: var(--sheet-accent); color: #0F1215; }
.tag.cool { background: #2C5A73; color: #FDF6F6; }
.tag.plain { color: var(--sheet-soft); border: 1px solid var(--sheet-rule); }
.sheetwho { margin: 16px 0 0; font-size: 29px; font-weight: 500; letter-spacing: -0.025em; line-height: 1.12; text-wrap: balance; }
.sheetwhat { margin: 8px 0 0; font-size: 15px; line-height: 1.4; }
.sheettext { margin: 18px 0 0; font-size: 14.5px; line-height: 1.62; color: var(--sheet-soft); }
.sheetlog { margin: 22px 0 0; padding-top: 16px; border-top: 1px solid var(--sheet-rule); }
.logitem { display: flex; gap: 12px; padding: 10px 0; font-size: 13px; line-height: 1.55; color: var(--sheet-soft); }
.logd { flex: 0 0 56px; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--sheet-fg); padding-top: 2px; }
.srcs { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--sheet-rule); display: flex; gap: 10px; flex-wrap: wrap; }
.src { min-height: 44px; display: inline-flex; align-items: center; padding: 0 18px; font-size: 12.5px; letter-spacing: 0.06em; text-transform: uppercase; text-decoration: none; color: var(--sheet-accent); border: 1px solid var(--sheet-accent); border-radius: 22px; }
.src.quiet { color: var(--sheet-soft); border-color: var(--sheet-rule); }
.sheetact { flex: 0 0 auto; padding: 14px 20px calc(18px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--sheet-rule); background: var(--sheet-raise); }
.bigbtn { width: 100%; min-height: 54px; font-size: 14px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; background: var(--sheet-accent); color: #0F1215; border: 0; border-radius: 27px; cursor: pointer; }
.actrow { display: flex; gap: 10px; margin-top: 10px; }
.actrow button { flex: 1 1 0; min-height: 48px; font-size: 12.5px; letter-spacing: 0.06em; text-transform: uppercase; background: transparent; color: var(--sheet-fg); border: 1px solid var(--sheet-rule); border-radius: 24px; cursor: pointer; }
.actrow button.quiet { color: var(--sheet-soft); }

/* ---- toast ---- */
#toast { position: absolute; left: 16px; right: 16px; bottom: calc(74px + env(safe-area-inset-bottom, 0px)); z-index: 40; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 14px; background: var(--fg); color: var(--bg); border-radius: 12px; font-size: 13px; }
#toast[hidden] { display: none !important; }
#toast button { background: transparent; border: 0; color: var(--coral); font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; min-height: 32px; padding: 0 2px; }

.empty { margin-top: 26px; padding: 26px 18px; text-align: center; border: 1px dashed var(--rule); border-radius: 16px; }
.empty .big { font-size: 19px; font-weight: 500; letter-spacing: -0.01em; }
.empty p { margin: 8px 0 0; font-size: 13px; line-height: 1.55; color: var(--fg-soft); }
.brand { height: 12px; width: 126px; max-width: 60%; margin-top: 16px; background: var(--logo) left center / contain no-repeat; }
.stamp { margin-top: 10px; font-size: 12px; color: var(--fg-soft); }

/* ---- generic figures ---- */
.ftiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-top: 16px; }
.ftile { background: var(--panel); border: 1px solid var(--rule); border-radius: 16px; padding: 16px 18px; min-width: 0; }
.ftile.hot { background: var(--accent-tint); border-color: var(--accent-edge); }
.ftile.hot .eyebrow, .ftile.hot .fval { color: var(--accent); }
.fval { margin-top: 6px; font-size: 28px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.1; }
.bigcard .ftiles { margin-top: 12px; }
.bigcard .ftile { background: transparent; }
.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
.clamp.open { display: block; -webkit-line-clamp: unset; }
.barsub { color: var(--fg-soft); font-size: 11.5px; margin-left: 6px; }
.kpic { font-size: 11px; color: var(--fg-faint); margin-top: 1px; }
.tablewrap { margin-top: 14px; overflow-x: auto; }
.dtable { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.dtable th { text-align: right; font-weight: 500; font-size: 11px; letter-spacing: 0.04em; color: var(--fg-soft); padding: 6px 8px; border-bottom: 1px solid var(--rule); }
.dtable td { text-align: right; padding: 8px; border-bottom: 1px solid var(--rule-soft); font-variant-numeric: tabular-nums; white-space: nowrap; }
.dtable th:first-child, .dtable td:first-child { text-align: left; white-space: normal; padding-left: 0; }
.dtable tr.tot td { font-weight: 500; border-bottom: 0; }

/* Pieces that only exist on one layout. */
.desk-only { display: none; }
.wide-grid > * { min-width: 0; }
.sheetempty { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; padding: 40px 44px; color: var(--sheet-soft); }
.sheetempty .big { font-size: 22px; font-weight: 500; letter-spacing: -0.015em; color: var(--sheet-fg); }
.sheetempty p { margin: 10px 0 0; font-size: 13.5px; line-height: 1.6; max-width: 34ch; }
.kbd { display: inline-block; min-width: 22px; padding: 1px 6px; border: 1px solid var(--sheet-rule); border-radius: 5px; font-size: 11px; text-align: center; color: var(--sheet-fg); }

/* ---- tablet: same single column, more room ---- */
@media (min-width: 700px) and (max-width: 1023.98px) {
  #app { max-width: 720px; }
  #pane { padding: 28px 28px 32px; }
}

/* ---- desktop: sidebar, working pane and a reading pane on the right ---- */
@media (min-width: 1024px) {
  .desk-only { display: block; }
  .mob-only { display: none !important; }

  #app {
    max-width: 1680px;
    display: grid;
    grid-template-columns: 212px minmax(0, 1fr) clamp(360px, 30vw, 540px);
    grid-template-rows: 60px minmax(0, 1fr);
    grid-template-areas: "head head head" "nav pane sheet";
    border-left: 1px solid var(--rule); border-right: 1px solid var(--rule);
  }
  #apphead { grid-area: head; height: 60px; padding: 0 28px; }
  #apphead .brand { height: 14px; width: 150px; }
  #apphead .stamp { font-size: 11px; }

  #tabs {
    grid-area: nav; flex-direction: column; gap: 2px;
    padding: 20px 14px; border-top: 0; border-right: 1px solid var(--rule);
    background: var(--bg); overflow-y: auto;
  }
  .tab {
    flex: 0 0 auto; min-height: 44px; flex-direction: row; justify-content: flex-start;
    gap: 12px; padding: 0 14px; border-radius: 10px; color: var(--fg-soft);
  }
  .tab:hover { background: var(--rule-soft); color: var(--fg); }
  .tab[aria-current="true"] { background: var(--accent-tint); color: var(--accent); }
  .tablbl { font-size: 14px; letter-spacing: 0; display: flex; flex: 1 1 auto; justify-content: space-between; }
  .tabcount { font-size: 12px; font-weight: 500; }

  #pane { grid-area: pane; padding: 36px 44px 48px; }
  #pane > * { max-width: 1060px; }
  h1.view { font-size: 34px; }
  .sub-line { font-size: 13.5px; }

  /* The reading pane takes the app's own theme, light or dark, rather than
     the always-dark sheet the phone uses. */
  #app {
    --sheet-bg: var(--bg); --sheet-fg: var(--fg); --sheet-soft: var(--fg-soft);
    --sheet-rule: var(--rule); --sheet-raise: var(--bg); --sheet-accent: var(--coral);
  }
  #sheet {
    grid-area: sheet; position: static; z-index: auto;
    border-left: 1px solid var(--rule);
    transition: none;
  }
  #sheet .src { color: var(--accent); border-color: var(--accent); }
  #sheet .src.quiet { color: var(--fg-soft); border-color: var(--rule); }
  #sheet .tag.cool { background: var(--blue-tint); color: var(--blue); }
  #sheet .sheetact { border-top-color: var(--rule); }
  #sheet.enter { transform: none; opacity: 1; }
  .sheettop { padding: 18px 22px 0; }
  .sheetbody { padding: 18px 32px 28px; }
  .sheetwho { font-size: 32px; }
  .sheettext { font-size: 15px; max-width: 62ch; }
  .sheetact { padding: 16px 32px 20px; }
  .bigbtn { min-height: 48px; }

  /* selected row in the list matches what is open on the right */
  .row.sel, .wrow.sel { background: var(--accent-tint); }

  .wrow.sel { box-shadow: inset 3px 0 0 var(--accent); }

  #toast { left: auto; right: calc(clamp(360px, 30vw, 540px) + 24px); bottom: 24px; width: 420px; max-width: calc(100% - 640px); }

  /* today: focus beside the tiles, then what you owe beside what you are owed */
  .hello h1.view { font-size: 38px; }
  .todaytop { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: stretch; margin-top: 20px; }
  .todaytop .focuscard { margin-top: 0; display: flex; flex-direction: column; }
  .todaytop #focus { flex: 1 1 auto; }
  .todaytop .tiles { display: contents; }
  .todaytop .tile { padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
  .todaytop .tileval { font-size: 26px; white-space: nowrap; }
  .rowmain:focus-visible, .wrow:focus-visible { outline-offset: -2px; }
  .wide-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 28px; align-items: start; }
  .needlist { max-height: none; overflow: visible; }
  .needlist .rowsub, .owedlist .rowsub { -webkit-line-clamp: 3; }

  /* numbers: marketplaces on the left, trading health and DTC on the right */
  .numgrid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; align-items: start; margin-top: 4px; }
  .numgrid .bigcard, .numgrid .hotcard { margin-top: 16px; }
  .numgrid .bigval { font-size: 44px; }

  /* work: projects and decisions side by side */
  .workgrid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 28px; align-items: start; }
  .workgrid h2.sec { margin-top: 16px; }
  .workgrid .card { margin-top: 0 !important; }
  .wnext { -webkit-line-clamp: 3; }

  .card, .bigcard, .hotcard, .tile, .focuscard { border-radius: 14px; }
  .rowmain { padding-top: 15px; padding-bottom: 15px; }
}
@media (min-width: 1440px) {
  #app { grid-template-columns: 232px minmax(0, 1fr) clamp(360px, 31vw, 560px); }
  #pane { padding: 40px 52px 56px; }
}

<body>
<div id="app">
  <header id="apphead">
    <div class="brand" role="img" aria-label="KEVIN.MURPHY"></div>
    <div class="stamp"></div>
  </header>

  <div id="pane" role="main"></div>

  <nav id="tabs" aria-label="Sections"></nav>

  <section id="sheet" hidden aria-label="Item detail"></section>

  <div id="toast" hidden role="status" aria-live="polite">
    <span id="toast-msg"></span>
    <button type="button" id="toast-undo">Undo</button>
  </div>
</div>

<script>
"use strict";

var DATA = { owe: [], owed: [], prj: [], dec: [] };
var LOADED = false;
var LOAD_ERR = null;

var APP_VERSION = "km-desk-v9";  /* keep in step with CACHE in service-worker.js */
var BUILT = null;     /* when the rebuild wrote desk.json */
var FETCHED = null;   /* when this app last read it */
var DESK_URL = "https://claude.ai/code/artifact/fb499e12-349a-4da5-8b82-e6046d23d692";

/* Marketplace, from Pi at the 5 Oct rebuild. MTD and FYTD run to 4 Oct:
   Pi's clock was a day behind. */
var MKT = {};

var ECOM = {};

/* ---------- local-only state (this browser) ---------- */
var LS = "kmdesk-mobile-v1";
var state = { tab: "today", filter: "owe", hotOnly: false, period: "mtd", focus: "", closed: {}, theme: "" };
try {
  var raw = localStorage.getItem(LS);
  if (raw) { var p = JSON.parse(raw); if (p && typeof p === "object") { for (var k in state) if (p[k] !== undefined) state[k] = p[k]; } }
} catch (e) {}
function save() { try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {} }
if (state.theme === "light" || state.theme === "dark") document.documentElement.setAttribute("data-theme", state.theme);

function live(list) {
  return list.filter(function (r) { return !state.closed[r.key]; });
}
function oweLive() { return live(DATA.owe); }
function owedLive() { return live(DATA.owed); }
function fmtWhen(d) {
  if (!d) return "";
  var now = new Date();
  var hm = d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }).replace(":", ".");
  if (d.toDateString() === now.toDateString()) return "today " + hm;
  var y = new Date(now); y.setDate(now.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return "yesterday " + hm;
  return d.toLocaleDateString("en-GB", { day: "numeric", month: "short" }) + " " + hm;
}
function stampLine() {
  if (!LOADED) return "Reading the desk\u2026";
  if (LOAD_ERR) return "Could not read the desk";
  var n = oweLive().filter(function (r) { return days(r.age) === 0; }).length;
  return (BUILT ? "Rebuilt " + fmtWhen(BUILT) : "Rebuild time not recorded")
    + (n ? " \u00b7 " + n + " new since the last run" : "");
}
function greeting() {
  var h = new Date().getHours();
  return h < 12 ? "Morning" : h < 18 ? "Afternoon" : "Evening";
}
function days(a) { var n = parseInt(a, 10); return isNaN(n) ? 0 : n; }

/* ---------- icons ---------- */
function svg(d, extra) {
  return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>';
}
var IC = {
  today: '<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>',
  owe: '<path d="m4 12 4 4 10-10"/><path d="M4 19h16"/>',
  num: '<path d="M5 20V11"/><path d="M12 20V5"/><path d="M19 20v-6"/>',
  work: '<path d="M3 7h18v13H3z"/><path d="M9 7V4h6v3"/>',
  more: '<circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/>',
  refresh: '<path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/>',
  chev: '<path d="m9 18 6-6-6-6"/>',
  back: '<path d="m15 18-6-6 6-6"/>'
};
function esc(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

/* ---------- rows ---------- */
function rowHTML(r, kind) {
  var hot = r.hot || days(r.age) > 7;
  var isNew = days(r.age) === 0;
  var sel = sheetFor && sheetFor.kind === kind && sheetFor.key === r.key;
  return '<div class="row' + (sel ? ' sel' : '') + '">'
    + '<button type="button" class="tickbtn" data-close="' + esc(kind) + ':' + esc(r.key) + '" aria-label="Close ' + esc(r.who) + '"><span></span></button>'
    + '<button type="button" class="rowmain" data-open="' + esc(kind) + ':' + esc(r.key) + '">'
      + '<span class="rowtext"><span class="rowwho">' + esc(r.who) + '</span>'
      + '<span class="rowsub">' + esc(r.sub) + '</span></span>'
      + (isNew ? '<span class="pill new">New</span>' : '<span class="age num' + (hot ? ' hot' : '') + '">' + esc(r.age) + '</span>')
      + '<span class="chev">' + svg(IC.chev) + '</span>'
    + '</button></div>';
}

/* ---------- views ---------- */
function loadingCard() {
  return '<div class="empty"><div class="big">'
    + (LOAD_ERR ? 'Could not read the desk' : 'Reading the desk\u2026')
    + '</div><p>'
    + (LOAD_ERR ? esc(LOAD_ERR) : 'The 06.00, 12.00 and 18.00 rebuild writes data/desk.json. This is the last copy it wrote.')
    + '</p></div>';
}

function viewToday() {
  var owe = oweLive(), owed = owedLive();
  var hot = owe.filter(function (r) { return days(r.age) > 7; });
  var top = owe.slice().sort(function (a, b) {
    var an = days(a.age) === 0 ? 1 : 0, bn = days(b.age) === 0 ? 1 : 0;
    if (an !== bn) return bn - an;
    return days(b.age) - days(a.age);
  });

  var tl = todayTiles();
  var h = '<div class="hello"><div>'
    + '<div class="eyebrow">' + esc(new Date().toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" })) + '</div>'
    + '<h1 class="view">' + greeting() + ', Richard</h1></div>'
    + '<button type="button" class="iconbtn" id="recheck" aria-label="Reload the desk">' + svg(IC.refresh) + '</button></div>'
    + '<div class="stamp">' + esc(stampLine()) + '</div>';

  h += '<div class="todaytop">';
  h += '<div class="focuscard"><div class="focushead"><span class="dot"></span><span class="eyebrow">Focus</span></div>'
    + '<label class="sr" for="focus">Focus for today</label>'
    + '<textarea id="focus" rows="2" placeholder="What actually has to happen today…">' + esc(state.focus) + '</textarea></div>';

  h += '<div class="tiles">'
    + '<div class="tile"><div class="tileval num">' + esc(tl.total) + '</div><div class="tilelbl"><b class="tilescope">All marketplaces</b>' + esc(tl.totalLbl) + '</div></div>'
    + '<div class="tile hot"><div class="tileval num">' + esc(tl.bb) + '</div><div class="tilelbl"><b class="tilescope">Amazon US</b>' + esc(tl.bbLbl) + '</div></div>'
    + '</div>';
  h += '</div>';

  h += '<div class="wide-grid"><section>';
  h += '<h2 class="sec">Needs you first</h2>';
  if (!LOADED) {
    h += loadingCard();
  } else if (!top.length) {
    h += '<div class="empty"><div class="big">Nothing owed by you</div><p>Every commitment on the desk is closed. New mail lands at the next rebuild — 06.00, 12.00 and 18.00 Copenhagen time.</p></div>';
  } else {
    h += '<div class="card needlist" tabindex="0" aria-label="Everything you owe, scrollable">' + top.map(function (r) { return rowHTML(r, "owe"); }).join("") + '</div>';
    if (top.length > 3) h += '<p class="note scrollhint mob-only">Scroll the list for all ' + top.length + ' \u00b7 tap any item for the full detail</p>';
    h += '<p class="note">' + owe.length + ' owed by you, ' + hot.length + ' of them over a week. ' + owed.length + ' owed to you.</p>';
  }
  h += '</section>';

  /* Desktop has room for the other side of the ledger. */
  if (LOADED && !LOAD_ERR) {
    var owedSorted = owed.slice().sort(function (a, b) { return days(b.age) - days(a.age); });
    h += '<section class="desk-only"><h2 class="sec">Owed to you</h2>'
      + (owedSorted.length
          ? '<div class="card owedlist">' + owedSorted.map(function (r) { return rowHTML(r, "owed"); }).join("") + '</div>'
          : '<div class="empty" style="margin-top:0"><div class="big">Nobody owes you</div><p>Nothing outstanding from anyone else.</p></div>')
      + '</section>';
  }
  h += '</div>';
  return h;
}

function viewOwe() {
  var isOwe = state.filter === "owe";
  var list = isOwe ? oweLive() : owedLive();
  if (state.hotOnly) list = list.filter(function (r) { return days(r.age) > 7; });
  list = list.slice().sort(function (a, b) { return days(b.age) - days(a.age); });

  var owe = oweLive(), owed = owedLive();
  var h = '<h1 class="view">' + (isOwe ? "You owe" : "Owed to you") + '</h1>'
    + '<p class="sub-line">' + list.length + ' shown · oldest first · tap a row for the whole thread</p>'
    + '<div class="chips">'
    + '<button type="button" class="chip" data-filter="owe" aria-pressed="' + isOwe + '">You owe ' + owe.length + '</button>'
    + '<button type="button" class="chip" data-filter="owed" aria-pressed="' + (!isOwe) + '">Owed to you ' + owed.length + '</button>'
    + '<button type="button" class="chip" id="hotonly" aria-pressed="' + state.hotOnly + '">Over a week</button>'
    + '</div>';

  if (!LOADED) {
    h += loadingCard();
  } else if (!list.length) {
    h += '<div class="empty"><div class="big">Nothing here</div><p>' + (state.hotOnly ? "Nothing in this list is more than a week old." : "This list is clear.") + '</p></div>';
  } else {
    h += '<div class="card" style="margin-top:16px">' + list.map(function (r) { return rowHTML(r, isOwe ? "owe" : "owed"); }).join("") + '</div>';
  }
  h += '<p class="note">Closing here stays on this device. It does not touch the shared register on the desk yet.</p>';
  return h;
}

/* ---------- figures ----------
   The rebuild sends each period as tiles {num, label, delta} and tables
   {head, rows}. Render whatever arrives; the original fixed shape is kept as a
   fallback so an older desk.json still reads. */
/* Find content by its shape rather than its field name: the rebuild renames
   fields from run to run (tiles/stats, trading_health/amazon_us_trading_health). */
function isTable(v) { return !!(v && typeof v === "object" && Array.isArray(v.rows)); }
function isTiles(v) { return Array.isArray(v) && v.length > 0 && v[0] && typeof v[0] === "object" && "num" in v[0]; }
function pickTiles(o) {
  if (!o || typeof o !== "object") return null;
  for (var k in o) if (isTiles(o[k])) return o[k];
  return null;
}
function pickTable(o, re) {
  if (!o || typeof o !== "object") return null;
  for (var k in o) if (re.test(k) && isTable(o[k])) return o[k];
  return null;
}
function pickText(o, keys) {
  var out = [];
  keys.forEach(function (k) { var v = o && o[k]; if (typeof v === "string") out.push(v); else if (Array.isArray(v)) v.forEach(function (x) { if (typeof x === "string") out.push(x); }); });
  return out;
}
function moneyOf(s) { var n = parseFloat(String(s || "").replace(/[^0-9.\-]/g, "")); return isNaN(n) ? 0 : n; }
function isGeneric(p) { return !!(p && (pickTiles(p) || pickTable(p, /market|health/i))); }
function findRow(tbl, re) {
  if (!tbl || !tbl.rows) return null;
  for (var i = 0; i < tbl.rows.length; i++) if (re.test(String(tbl.rows[i][0]))) return tbl.rows[i];
  return null;
}
function todayTiles() {
  var m = MKT.mtd || {};
  if (isGeneric(m)) {
    var t0 = (pickTiles(m) || [])[0] || {};
    var ht = pickTable(m, /health/i);
    var bb = findRow(ht, /^buy box/i);
    var th = (ht && ht.head) || [];
    return {
      total: t0.num || "—", totalLbl: t0.label || "Sell-out, month to date",
      bb: bb ? bb[1] : "—",
      bbLbl: bb ? "Buy box" + (bb[2] ? ", " + bb[2] + " in " + (th[2] || "the prior period") : "") : "Buy box"
    };
  }
  return { total: m.total || "—", totalLbl: "Sell-out, month to date", bb: m.buyboxShort || "—", bbLbl: m.buyboxDelta || "Buy box" };
}
function clampP(text, cls) {
  if (!text) return "";
  return '<p class="note clamp' + (cls ? " " + cls : "") + '" title="Click to expand">' + esc(text) + '</p>';
}
function tableHTML(tb, cls) {
  if (!tb || !tb.rows || !tb.rows.length) return "";
  var head = tb.head || [];
  return '<div class="tablewrap"><table class="dtable' + (cls ? " " + cls : "") + '">'
    + (head.length ? '<thead><tr>' + head.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join("") + '</tr></thead>' : "")
    + '<tbody>' + tb.rows.map(function (r) {
        var tot = /^total$/i.test(String(r[0]));
        return '<tr' + (tot ? ' class="tot"' : "") + '>' + r.map(function (c) { return '<td>' + esc(c) + '</td>'; }).join("") + '</tr>';
      }).join("") + '</tbody></table></div>';
}
function tileCards(tiles, hotRe) {
  if (!tiles || !tiles.length) return "";
  return '<div class="ftiles">' + tiles.map(function (x) {
    var hot = hotRe && hotRe.test(x.label || "");
    return '<div class="ftile' + (hot ? " hot" : "") + '"><div class="eyebrow">' + esc(x.label) + '</div>'
      + '<div class="fval num">' + esc(x.num) + '</div>' + clampP(x.delta) + '</div>';
  }).join("") + '</div>';
}
function mktBars(tb, p) {
  if (!tb || !tb.rows) return "";
  var rows = tb.rows.filter(function (r) { return !/^total$/i.test(String(r[0])); });
  var sum = rows.reduce(function (a, r) { return a + moneyOf(r[1]); }, 0) || 1;
  var shares = rows.map(function (r) {
    var s = parseFloat(String(r[3] || "").replace(/[^0-9.]/g, ""));
    return isNaN(s) ? moneyOf(r[1]) / sum * 100 : s;
  });
  var max = Math.max.apply(null, shares.concat([1]));
  var tot = findRow(tb, /^total$/i) || (p && p.total ? ["Total", p.total, p.total_units || ""] : null);
  var head = tb.head || [];
  return '<div class="bigcard"><div class="eyebrow">' + esc((head[0] || "Marketplace") + " · " + (head[1] || "")) + '</div>'
    + (tot ? '<div class="bigval num">' + esc(tot[1]) + '</div><div class="note" style="margin-top:6px">' + esc(tot[2] ? tot[2] + " units" : "") + '</div>' : "")
    + '<div class="bars">' + rows.map(function (r, i) {
        var col = /amazon us/i.test(r[0]) ? "var(--fg)" : /walmart/i.test(r[0]) ? "var(--lilac)" : "var(--blue)";
        return '<div class="barrow"><div class="barhead"><span>' + esc(r[0]) + '</span><span class="num"><b style="font-weight:500">' + esc(r[1]) + '</b>'
          + (r[2] ? ' <span class="barsub">' + esc(r[2]) + ' units · ' + (r[3] ? esc(r[3]) : shares[i].toFixed(1) + "%") + '</span>' : "") + '</span></div>'
          + '<div class="bartrack"><span class="barfill" style="width:' + Math.max(1.5, shares[i] / max * 100) + '%;background:' + col + '"></span></div></div>';
      }).join("") + '</div></div>';
}
function healthCard(tb) {
  if (!tb || !tb.rows) return "";
  var head = tb.head || [];
  return '<div class="hotcard"><div class="eyebrow" style="color:var(--accent)">' + esc(head[0] || "Trading health") + ' · ' + esc(head[1] || "") + '</div>'
    + '<div class="grid2">' + tb.rows.map(function (r) {
        var hot = /buy box|lost/i.test(r[0]);
        var lbl = String(r[0]).split(",")[0];
        return '<div><div class="kpi num"' + (hot ? ' style="color:var(--accent)"' : "") + '>' + esc(r[1]) + '</div>'
          + '<div class="kpil"' + (hot ? ' style="color:var(--accent)"' : "") + '>' + esc(lbl) + '</div>'
          + (r[2] ? '<div class="kpic">' + esc((head[2] || "Before") + ": " + r[2]) + '</div>' : "") + '</div>';
      }).join("") + '</div></div>';
}
function ecomCard(E) {
  if (!E || !(pickTiles(E) || pickTable(E, /./))) return "";
  var notes = pickText(E, ["note", "notes"]);
  return '<div class="bigcard"><div class="eyebrow">E-commerce and channels · ' + esc(E.period || "") + '</div>'
    + tileCards(pickTiles(E)) + tableHTML(pickTable(E, /./))
    + (E.caveat ? '<p class="note" style="color:var(--accent)">' + esc(E.caveat) + '</p>' : "")
    + notes.map(function (n) { return clampP(n); }).join("")
    + (E.source ? '<p class="note">Source: ' + esc(E.source) + '</p>' : "") + '</div>';
}

function viewNumbers() {
  var p = MKT[state.period];
  if (!LOADED || LOAD_ERR) return '<h1 class="view">Numbers</h1>' + loadingCard();
  if (!p) {
    return '<h1 class="view">Numbers</h1><div class="empty"><div class="big">No figures in this rebuild</div>'
      + '<p>The last rebuild did not include the marketplace or e-commerce numbers. They come back when the rebuild sends them again.</p></div>';
  }
  if (!isGeneric(p)) return viewNumbersLegacy(p);
  var lbl = function (k, d) { var x = MKT[k]; return esc((x && x.label) || d); };
  var h = '<h1 class="view">Numbers</h1><p class="sub-line">' + esc(MKT.source || "Pattern Intelligence") + (MKT.read_at && !isNaN(Date.parse(MKT.read_at)) ? ' · read ' + esc(fmtWhen(new Date(MKT.read_at))) : "") + '</p>'
    + '<div class="chips">'
    + '<button type="button" class="chip" data-period="mtd" aria-pressed="' + (state.period === "mtd") + '">' + lbl("mtd", "This month") + '</button>'
    + '<button type="button" class="chip" data-period="last" aria-pressed="' + (state.period === "last") + '">' + lbl("last", "Last month") + '</button>'
    + '<button type="button" class="chip" data-period="fytd" aria-pressed="' + (state.period === "fytd") + '">' + lbl("fytd", "FY27") + '</button>'
    + '</div>';
  h += tileCards(pickTiles(p), /lost|buy.?box/i);
  h += '<div class="numgrid"><div>' + mktBars(pickTable(p, /market/i), p) + '</div><div>' + healthCard(pickTable(p, /health/i)) + '</div></div>';
  pickText(p, ["note", "notes"]).forEach(function (n) { h += clampP(n); });
  var pur = MKT.purchases;
  if (pur && pur.tables && pur.tables.length) {
    h += '<h2 class="sec">Pattern purchases</h2><div class="bigcard" style="margin-top:0">'
      + pur.tables.map(function (tb) { return tableHTML(tb); }).join("")
      + pickText(pur, ["notes", "note", "what_it_says", "how_measured"]).map(function (n) { return clampP(n); }).join("") + '</div>';
  }
  if (ECOM && (pickTiles(ECOM) || pickTable(ECOM, /./))) h += '<h2 class="sec">E-commerce</h2>' + ecomCard(ECOM).replace('class="bigcard"', 'class="bigcard" style="margin-top:0"');
  else if (ECOM && ECOM.val) h += '<div class="bigcard"><div class="eyebrow">E-commerce (DTC) · ' + esc(ECOM.month) + '</div><div class="fval num">' + esc(ECOM.val) + '</div><p class="note">' + esc(ECOM.vs || "") + '</p></div>';
  return h;
}

function viewNumbersLegacy(p) {
  var h = '<h1 class="view">Numbers</h1><p class="sub-line">Two separate channels · marketplace sell-out from Pattern Intelligence, e-commerce (DTC) from the month-end recap</p>'

/* Step through whatever list is on screen, in the order it is shown. */
function stepSheet(dir) {

  var cur = sheetFor ? sheetFor.kind + ":" + sheetFor.key : null;
  var i = -1;
  for (var j = 0; j < els.length; j++) if (els[j].getAttribute("data-open") === cur) { i = j; break; }
  var n = i < 0 ? (dir > 0 ? 0 : els.length - 1) : i + dir;

/* ---------- events ---------- */
document.addEventListener("click", function (ev) {
  var cl = ev.target.closest ? ev.target.closest(".clamp") : null;
  if (cl) { cl.classList.toggle("open"); return; }
  var el = ev.target.closest ? ev.target.closest("[data-tab],[data-open],[data-close],[data-filter],[data-period],#hotonly,#sheetback,#act-close,#act-snooze,#act-next,#themebtn,#recheck") : null;
  if (!el) return;

  if (el.hasAttribute("data-tab")) { state.tab = el.getAttribute("data-tab"); save(); closeSheet(); render(); return; }
  if (el.hasAttribute("data-filter")) { state.filter = el.getAttribute("data-filter"); save(); render(); return; }
  if (el.hasAttribute("data-period")) { state.period = el.getAttribute("data-period"); save(); render(); return; }
  if (el.id === "hotonly") { state.hotOnly = !state.hotOnly; save(); render(); return; }

  if (el.hasAttribute("data-open")) {
    var a = el.getAttribute("data-open").split(":");
    openSheet(a[0], a.slice(1).join(":"));
    return;
  }
  if (el.hasAttribute("data-close")) {
    var b = el.getAttribute("data-close").split(":");
    var r = find(b[0], b.slice(1).join(":"));
    closeItem(b[0], b.slice(1).join(":"), r ? r.who : "Item");
    render();
    return;
  }
  if (el.id === "sheetback") { closeSheet(); render(); return; }

  if (el.id === "act-close" && sheetFor) {
    var cur = find(sheetFor.kind, sheetFor.key);
    var kind = sheetFor.kind, key = sheetFor.key;
    closeItem(kind, key, cur ? (cur.who || cur.name) : "Item");
    closeSheet();
    render();
    return;
  }
  if ((el.id === "act-snooze" || el.id === "act-next") && sheetFor) {
    var k = sheetFor.kind, kk = sheetFor.key;
    if (document.querySelector('#pane [data-open="' + k + ':' + kk + '"]')) {
      var before = sheetFor.key;
      stepSheet(1);
      if (sheetFor && sheetFor.key === before) { closeSheet(); render(); }
      return;
    }
    var list = (k === "owe" ? oweLive() : owedLive()).slice().sort(function (x, y) { return days(y.age) - days(x.age); });
    var i2 = -1;
    for (var j = 0; j < list.length; j++) if (list[j].key === kk) i2 = j;
    if (i2 > -1 && i2 + 1 < list.length) { openSheet(k, list[i2 + 1].key); }
    else { closeSheet(); render(); }
    return;
  }
  if (el.id === "themebtn") {
    var cur2 = document.documentElement.getAttribute("data-theme") || "";
    var next = themes[(themes.indexOf(cur2) + 1) % themes.length];
    if (next) document.documentElement.setAttribute("data-theme", next);
    else document.documentElement.removeAttribute("data-theme");
    state.theme = next; save();
    var tv2 = document.getElementById("themeval");
    if (tv2) tv2.textContent = themeLabel();
    return;
  }
  if (el.id === "recheck") {
    el.classList.add("spin");
    loadDesk(true).then(function () { el.classList.remove("spin"); });
    return;
  }
});

document.addEventListener("keydown", function (ev) {

/* The desk is data, not code: the Worker serves data/desk.json from KV, where
   each rebuild writes it. Offline, the service worker serves the last copy. */
/* Accept the rebuild's field names as well as the original ones, so a
   renamed field shows up as text rather than a blank screen. */
function srcLink(href, label) {
  return typeof href === "string" && /^https:\/\//.test(href) ? [{ label: label, href: href }] : [];
}
function humanKey(k) {
  var s = String(k || "").replace(/^(prj|owe|owed|dec)-/, "").replace(/-/g, " ");
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function normDesk(d) {
  function person(r) {
    return {
      key: r.key, who: r.who || "", hot: !!r.hot,
      age: r.age != null ? String(r.age) : (r.age_days != null ? r.age_days + "d" : ""),
      sub: r.sub || r.detail || r.summary || "",
      links: r.links || srcLink(r.source, "Mail")
    };
  }
  return {
    owe: (d.owe || []).map(person),
    owed: (d.owed || []).map(person),
    prj: (d.prj || []).map(function (r) {
      return {
        key: r.key, name: r.name || r.title || humanKey(r.key),
        owner: r.owner || "", when: r.when || "",
        next: r.next || r.next_step || "", log: r.log || [],
        links: r.links || srcLink(r.asana, "Asana").concat(srcLink(r.source, "Mail"))
      };
    }),
    dec: (d.dec || []).map(function (r) {
      return {
        key: r.key, date: r.date || "",
        what: r.what || r.decision || "", why: r.why || r.because || "",
        links: r.links || srcLink(r.source, "Mail")
      };
    }),
    mkt: d.mkt || {}, ecom: d.ecom || {},
    built: d.built || (d.rebuilt && d.rebuilt.iso) || null
  };
}

function loadDesk(manual) {
  var before = BUILT ? BUILT.getTime() : null;
  return fetch("./data/desk.json", { cache: "no-store" })
    .then(function (r) {
      if (!r.ok) throw new Error("data/desk.json returned " + r.status);
      var w = r.headers.get("X-Desk-Written");
      return r.json().then(function (d) { return { d: d, w: w }; });
    })
    .then(function (x) {
      if (!(x.d && x.d.owe && x.d.owed && x.d.prj && x.d.dec)) throw new Error("data/desk.json is not in the expected shape.");
      var d = normDesk(x.d);
      DATA = d; MKT = d.mkt || {}; ECOM = d.ecom || {};
      var b = d.built || x.w;
      BUILT = b && !isNaN(Date.parse(b)) ? new Date(b) : null;
      FETCHED = new Date();
      LOADED = true; LOAD_ERR = null;
      render(); syncOnline();
      if (manual) {
        if (!navigator.onLine) showToast("Offline — showing the copy from " + (BUILT ? fmtWhen(BUILT) : "the last load"));
        else if (BUILT && before === BUILT.getTime()) showToast("Up to date — next rebuild is due at " + nextRebuild());
        else showToast("Updated to the rebuild " + (BUILT ? fmtWhen(BUILT) : "just written"));
      }
    })
    .catch(function (e) {
      var msg = (e && e.message) || "data/desk.json could not be read.";
      if (!DATA.owe.length) { LOADED = true; LOAD_ERR = msg; render(); }
      if (manual) showToast("Could not reload the desk — " + msg);
    });
}
/* The rebuild runs at 06.00, 12.00 and 18.00 (CET). */
function nextRebuild() {
  var h = parseInt(new Date().toLocaleString("en-GB", { timeZone: "Europe/Berlin", hour: "2-digit", hourCycle: "h23" }), 10);
  return (h < 6 ? "06.00" : h < 12 ? "12.00" : h < 18 ? "18.00" : "06.00 tomorrow") + " CET";
}
loadDesk(false);

/* Coming back to the app picks up a newer rebuild without a tap. */
document.addEventListener("visibilitychange", function () {
  if (document.visibilityState === "visible" && (!FETCHED || Date.now() - FETCHED.getTime() > 60000)) loadDesk(false);
});

/* Updates install themselves: check for a new service worker whenever the app
   comes back to the foreground, and reload once when one takes over, so a
   deploy reaches the phone without force-quitting the app. */
if ("serviceWorker" in navigator) {
  var hadController = !!navigator.serviceWorker.controller, reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", function () {
    if (!hadController) { hadController = true; return; }   /* first install: nothing to replace */
    if (reloading) return;
    reloading = true;
    location.reload();
  });
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./service-worker.js", { updateViaCache: "none" }).then(function (reg) {
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "visible") reg.update().catch(function () {});
      });
    }).catch(function () {});
  });
}
</script>
</body>
